[pytest]
# Nur das echte Testverzeichnis einsammeln.
#
# Im Wurzelverzeichnis liegen zwei aeltere Hilfsskripte, test_auth_flow.py
# und test_csrf_flow.py. Sie enthalten keine Testfunktionen, sondern
# fuehren beim IMPORT HTTP-Aufrufe gegen einen laufenden
# Entwicklungsserver auf 127.0.0.1:5000 aus. Weil ihr Name dem
# Sammelmuster entspricht, importierte pytest sie mit - und die gesamte
# Sammlung brach mit ConnectionError ab, sobald kein Server lief. Der
# Testlauf haing damit an einer Bedingung ausserhalb der Testsuite.
#
# testpaths behebt genau das. Die 64 echten Testdateien liegen
# ausnahmslos unter tests/; es geht kein Test verloren.
testpaths = tests
