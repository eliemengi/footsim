[pytest]
# Nur das echte Testverzeichnis einsammeln.
#
# Im Wurzelverzeichnis liegen zwei aeltere Hilfsskripte, test_auth_flow.py
# und test_csrf_flow.py. Sie enthalten keine Testfunktionen, sondern
# fuehren beim IMPORT HTTP-Aufrufe gegen einen laufenden
# Entwicklungsserver auf 127.0.0.1:5000 aus. Weil ihr Name dem
# Sammelmuster entspricht, importierte pytest sie mit - und die gesamte
# Sammlung brach mit ConnectionError ab, sobald kein Server lief. Der
# Testlauf haing damit an einer Bedingung ausserhalb der Testsuite.
#
# testpaths behebt genau das. Die 64 echten Testdateien liegen
# ausnahmslos unter tests/; es geht kein Test verloren.
testpaths = tests

# Browsertests laufen NICHT im Standardlauf mit.
#
# WARUM: Sie starten einen echten Flask-Server, bauen die Testdatenbank
# neu auf und laden das app-Modul neu. Das ist notwendig, veraendert aber
# den gemeinsamen Prozesszustand. Im selben Lauf wie die uebrige Suite
# brachte das 50 Datenbanktests zum Ueberspringen und zwei zum Fallen -
# nicht weil die Anwendung kaputt waere, sondern weil zwei Testdateien um
# dieselbe Datenbank stritten.
#
# Deshalb ein eigener Lauf:
#
#     python -m pytest tests/ -q                        Standardlauf
#     python -m pytest tests/ -q --e2e -m e2e           Browsertests
#
# Ohne --e2e ueberspringen sie sich mit einer sichtbaren Begruendung.
# Das ist ausdruecklich KEINE Entwarnung: tests/test_js_syntax.py prueft
# denselben Code statisch und laeuft IMMER mit.
markers =
    e2e: Browsertest mit Playwright - eigener Lauf, siehe --e2e
