# Dauerpruefung fuer FootSim.
#
# WARUM ES DIESE DATEI GIBT
# -------------------------
# Am 24.08.2026 legte eine doppelte const-Deklaration in
# static/script.js die gesamte Anwendung im Browser lahm. Die Python-
# Suite war dabei durchgehend gruen - sie hatte die Datei nie geparst,
# nur nach Zeichenketten durchsucht.
#
# Dieser Ablauf prueft deshalb BEIDES: die Python-Suite und den
# Browsercode. Der JavaScript-Schritt laeuft zusaetzlich mit Node, weil
# node --check die Datei mit derselben Engine liest wie der Browser.
# Lokal steht Node nicht immer bereit; hier schon.
#
# Keine Secrets, keine Anbieterzugriffe, keine Datenbank: Alles, was
# hier laeuft, kommt ohne aus.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    name: Browsercode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Dieselbe Engine wie im Browser. Faengt Syntaxfehler sofort.
      - name: node --check
        run: |
          node --check static/script.js
          node --check static/sw.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Der Parser findet zusaetzlich doppelte Bindungen. node --check
      # allein reicht nicht: Zwei gleiche const-Deklarationen sind ein
      # Scope-Fehler, kein Parsefehler - und genau das war der Ausfall.
      - name: Parser- und Bindungspruefung
        run: |
          python -m pip install --upgrade pip
          python -m pip install tree-sitter==0.26.0 tree-sitter-javascript==0.25.0 pytest==8.4.2
          python -m pytest tests/test_js_syntax.py -v

  python:
    name: Testsuite
    runs-on: ubuntu-latest

    # Echte Zielumgebung statt SQLite.
    #
    # SQLite hatte zwar den Collection-Fehler beseitigt, aber die
    # postgres_db-Fixture verlangt eine URL, die 'footsim_db' enthaelt -
    # und uebersprang sonst. Damit liefen 84 Tests nicht mit, darunter
    # Auth, CSRF, Privacy, Migrationen und Security-Hardening. Genau die
    # Bereiche, in denen ein Fehler am teuersten waere.
    #
    # postgres:15-alpine ist dieselbe Fassung wie in docker-compose.yml.
    # Eine andere Hauptversion zu testen als die, die laeuft, waere eine
    # stille Annahme.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: footsim_ci
          POSTGRES_DB: footsim_db
          # KEIN Passwort - und das ist Absicht.
          #
          # Der erste Entwurf hatte hier eines. Ein bestehender Test hat
          # ihn zu Recht abgelehnt:
          # test_audit_hardening.test_no_tracked_file_contains_inline_dsn_credentials
          # sperrt Verbindungszeichenfolgen mit Zugangsdaten in
          # getrackten Dateien - genau die Regressionsklasse, wegen der
          # die Zugangsdaten aus docker-compose.yml entfernt wurden.
          #
          # Die Pruefung zu umgehen waere falsch gewesen. Richtig ist,
          # dass es nichts zu verbergen gibt: Dieser Dienst ist
          # ausschliesslich aus diesem Job erreichbar, existiert nur fuer
          # dessen Laufzeit und enthaelt ausschliesslich Testdaten. Ohne
          # Passwort steht auch keines in der Datei.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U footsim_ci -d footsim_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Der Host MUSS localhost sein: tests/conftest.py verweigert aus
      # Sicherheitsgruenden jede nicht-lokale Datenbank, weil die Fixture
      # drop_all() aufruft. Und der Name MUSS footsim_db enthalten, sonst
      # ueberspringt dieselbe Fixture.
      DATABASE_URL: postgresql://footsim_ci@localhost:5432/footsim_db
      SECRET_KEY: footsim-ci-only-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Die Fixture ersetzt 'footsim_db' durch 'footsim_test_db' und
      # erwartet, dass es diese Datenbank gibt - sie legt sie nicht an.
      # Ohne diesen Schritt scheitert jeder Datenbanktest an der
      # Verbindung statt an seinem Pruefgegenstand.
      - name: Testdatenbank anlegen
        run: |
          vorhanden=$(psql -h localhost -U footsim_ci -d footsim_db -tAc "SELECT 1 FROM pg_database WHERE datname='footsim_test_db'")
          if [ "$vorhanden" != "1" ]; then
            psql -h localhost -U footsim_ci -d footsim_db -c "CREATE DATABASE footsim_test_db OWNER footsim_ci"
          fi

      # Die Datenbanktests laufen jetzt wirklich mit. Was sich weiterhin
      # ueberspringt, sind die Browsertests (eigener Lauf, siehe
      # pytest.ini) und Tests, die private Datensnapshots brauchen -
      # beides mit sichtbarer Begruendung durch -ra, statt still zu
      # verschwinden.
      - name: pytest
        run: python -m pytest tests/ -q -ra
